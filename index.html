<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viewer</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; font:14px/1.45 system-ui,sans-serif;
    background:#0e1014; color:#e8ecf4;
    display:flex; flex-direction:column; height:100vh;
  }
  header{
    display:flex; gap:8px; padding:10px;
    background:#161a22; border-bottom:1px solid #2b3140;
  }
  input{
    flex:1; background:#1e232e; color:#e8ecf4;
    border:1px solid #2b3140; border-radius:8px;
    padding:10px 12px; font:inherit; outline:0;
  }
  input:focus{border-color:#5b8cff}
  button{
    background:#5b8cff; color:#fff; border:0;
    border-radius:8px; padding:10px 18px;
    font:inherit; font-weight:600; cursor:pointer;
  }
  button:hover{filter:brightness(1.1)}
  #stage{flex:1; min-height:0; background:#fff}
</style>
</head>
<body>

<header>
  <input id="url" placeholder="https://example.com" autofocus spellcheck="false">
  <button id="go">Go</button>
</header>

<div id="stage"></div>

<!-- 1. BareMux (transport layer) -->
<script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2/dist/index.js"></script>

<!-- 2. Epoxy transport (Wisp client, WASM bundled as base64) -->
<script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-tls@2/bundled/index.js"></script>

<!-- 3. Scramjet (rewriter + controller) -->
<script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/scramjet@2/dist/scramjet.all.js"></script>

<script>
(async () => {
  const WISP_URL = "wss://wisp.mercurywork.shop";

  // --- Register the service worker ---
  const reg = await navigator.serviceWorker.register("./sw.js", { scope: "./" });
  await navigator.serviceWorker.ready;

  // --- Wire BareMux to the Epoxy transport + Wisp relay ---
  const connection = new BareMux.BareMuxConnection("./baremux/worker.js");
  await connection.setTransport("/epoxy/index.mjs", [{ wisp: WISP_URL }]);

  // --- Boot Scramjet ---
  const { ScramjetController } = $scramjetLoadController();
  const scramjet = new ScramjetController({
    files: {
      wasm: "https://cdn.jsdelivr.net/npm/@mercuryworkshop/scramjet@2/dist/scramjet.wasm.wasm",
      all:  "https://cdn.jsdelivr.net/npm/@mercuryworkshop/scramjet@2/dist/scramjet.all.js",
      sync: "https://cdn.jsdelivr.net/npm/@mercuryworkshop/scramjet@2/dist/scramjet.sync.js",
    },
  });
  await scramjet.init();

  // --- Navigate ---
  const urlInput = document.getElementById("url");
  const goBtn    = document.getElementById("go");
  const stage    = document.getElementById("stage");

  async function go() {
    const raw = urlInput.value.trim();
    if (!raw) return;
    const target = /^https?:\/\//i.test(raw) ? raw : "https://" + raw;
    const frame = scramjet.createFrame();
    stage.innerHTML = "";
    stage.appendChild(frame.frame);
    frame.go(target);
  }

  goBtn.addEventListener("click", go);
  urlInput.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
})();
</script>
</body>
</html>
